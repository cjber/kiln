name: Release

# Pushing a vX.Y.Z tag (see scripts/release.ts) publishes a GitHub release and
# the AUR package. The AUR step needs the AUR_SSH_PRIVATE_KEY secret: the
# private half of a key registered on the maintainer's AUR account.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  binaries:
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ calls

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check and build Android release
        run: android/gradlew -p android checkKotlinFormat testReleaseUnitTest lintRelease assembleRelease --console plain
      - name: Sign Android release
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE"
          test -n "$ANDROID_RELEASE_PASSWORD"
          umask 077
          keyfile="$RUNNER_TEMP/kiln-release.p12"
          trap 'command rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$keyfile"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias kiln --ks-pass env:ANDROID_RELEASE_PASSWORD --key-pass env:ANDROID_RELEASE_PASSWORD --out kiln-android.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose kiln-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiln-android-release
          path: kiln-android.apk
          if-no-files-found: error

  release:
    needs: [binaries, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile --os linux --cpu "*"
      - run: bunx tsc --noEmit -p .
      - run: bun test

      - name: Check the tag is on main and matches package.json
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build standalone binaries
        run: bun scripts/build.ts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kiln-android-release
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/changelog.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/kiln-linux-x64 dist/kiln-linux-arm64 dist/kiln-android.apk --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "kiln $GITHUB_REF_NAME"

      - name: Render AUR package
        run: |
          set -euo pipefail
          curl -fsSL -o source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          bun scripts/render-aur.ts --version "$VERSION" --sha256 "$(sha256sum source.tar.gz | cut -d' ' -f1)" --bin-x64-sha256 "$(sha256sum dist/kiln-linux-x64 | cut -d' ' -f1)" --bin-arm64-sha256 "$(sha256sum dist/kiln-linux-arm64 | cut -d' ' -f1)" --out aur

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/known_hosts <<'KEYS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          KEYS
          sed -i 's/^ *//' ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          for pkgname in kiln-agents kiln-agents-bin; do
            rendered=aur
            if [ "$pkgname" = kiln-agents-bin ]; then rendered=aur/bin; fi
            git clone "ssh://aur@aur.archlinux.org/${pkgname}.git" "aur-${pkgname}"
            cp "$rendered/PKGBUILD" "$rendered/.SRCINFO" "aur-${pkgname}/"
            git -C "aur-${pkgname}" config user.name "cjber"
            git -C "aur-${pkgname}" config user.email "cjberragan@gmail.com"
            git -C "aur-${pkgname}" add PKGBUILD .SRCINFO
            if git -C "aur-${pkgname}" diff --cached --quiet; then continue; fi
            git -C "aur-${pkgname}" commit -m "${pkgname} ${VERSION}"
            git -C "aur-${pkgname}" push origin HEAD:master
          done
