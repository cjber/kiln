version: 2
updates:
  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
