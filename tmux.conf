# Kiln's private server (tmux -L kiln). Nothing here is a multiplexer: one agent
# per session and no prefix. The detach key and whether the status bar shows come
# from ~/.config/kiln/config.toml and are applied on every attach.
set -g prefix None
unbind-key -q -a -T prefix

set -g status-position bottom
set -g status-interval 3
set -g status-style "bg=default,fg=#555555"
set -g status-left-length 60
set -g status-right-length 80
set -g status-left " #[fg=#b0b0b0]#{@kiln_title}#[default]"
# One agent per session, so the window list would only repeat the title.
set -g window-status-format ""
set -g window-status-current-format ""

set -g mouse on
set -g mode-keys vi
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB,*:hyperlinks"
# Shift+Enter and friends reach the agent instead of collapsing into plain Enter.
set -g extended-keys always
# tmux before 3.5 keeps its native extended-key format.
set -gq extended-keys-format csi-u
set -ga terminal-features ",xterm-kitty:extkeys"
